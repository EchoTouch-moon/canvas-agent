name: Context Runtime CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'research/**'
      - 'scripts/ci/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.prettierrc.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/electron.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'research/**'
      - 'scripts/ci/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.prettierrc.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/electron.yml'

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install headless workspace dependencies
        run: |
          mkdir -p ci-artifacts/logs
          set -o pipefail
          pnpm install --frozen-lockfile --filter '!@canvas-agent/desktop' 2>&1 | tee ci-artifacts/logs/install-core.log

      - name: Audit headless production dependency paths
        run: |
          set -o pipefail
          node scripts/ci/audit-core.mjs 2>&1 | tee ci-artifacts/logs/audit-core.log

      - name: Check headless workspace
        run: |
          mkdir -p ci-artifacts/logs
          set -o pipefail
          pnpm format:check:core 2>&1 | tee ci-artifacts/logs/format-core.log
          pnpm lint:core 2>&1 | tee ci-artifacts/logs/lint-core.log
          pnpm typecheck:core 2>&1 | tee ci-artifacts/logs/typecheck-core.log
          pnpm test:core 2>&1 | tee ci-artifacts/logs/test-core.log
          pnpm build:core 2>&1 | tee ci-artifacts/logs/build-core.log
          node --test scripts/ci/audit-core.test.mjs 2>&1 | tee ci-artifacts/logs/audit-core-tests.log

      - name: Upload headless check logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: context-runtime-check-logs
          path: ci-artifacts
          if-no-files-found: error
