name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: |
          mkdir -p ci-artifacts/logs
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee ci-artifacts/logs/install.log

      - name: Audit production dependencies (high/critical)
        run: |
          set -o pipefail
          pnpm audit --prod --audit-level high 2>&1 | tee ci-artifacts/logs/audit-prod.log

      - name: Check (format / lint / typecheck / test / build)
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee ci-artifacts/logs/check.log

      - name: Upload source logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: source-check-logs
          path: ci-artifacts
          if-no-files-found: error

  macos-electron:
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: |
          mkdir -p ci-artifacts/logs
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee ci-artifacts/logs/install.log

      - name: Credential-free Product MVP RC suite
        run: |
          mkdir -p ci-artifacts/logs
          set -o pipefail
          CANVAS_AGENT_RC_LOG_DIR="$PWD/ci-artifacts/logs" \
          CANVAS_AGENT_RC_REPORT_DIR="$PWD/ci-artifacts/reports" \
          CANVAS_AGENT_E2E_SCREENSHOT_DIR="$PWD/ci-artifacts/screenshots" \
          pnpm e2e:rc 2>&1 | tee ci-artifacts/logs/rc-suite.log

      - name: Upload logs, screenshots and reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-product-mvp-rc-evidence
          path: ci-artifacts
          if-no-files-found: error
