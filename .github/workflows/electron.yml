name: Electron Reference Client CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/contracts/**'
      - 'packages/domain/**'
      - 'packages/persistence/**'
      - 'packages/worker-runtime/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/electron.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/contracts/**'
      - 'packages/domain/**'
      - 'packages/persistence/**'
      - 'packages/worker-runtime/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/electron.yml'

jobs:
  electron-check:
    name: electron-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install reference client dependencies
        run: |
          mkdir -p ci-artifacts/logs
          set -o pipefail
          pnpm install --frozen-lockfile --filter '@canvas-agent/desktop...' 2>&1 | tee ci-artifacts/logs/install-electron.log

      - name: Audit full production dependency graph
        run: |
          set -o pipefail
          pnpm audit --prod --audit-level high 2>&1 | tee ci-artifacts/logs/audit-electron.log

      - name: Check reference client
        run: |
          set -o pipefail
          pnpm --filter @canvas-agent/desktop format:check 2>&1 | tee ci-artifacts/logs/format-electron.log
          pnpm --filter @canvas-agent/desktop lint 2>&1 | tee ci-artifacts/logs/lint-electron.log
          pnpm --filter @canvas-agent/desktop typecheck 2>&1 | tee ci-artifacts/logs/typecheck-electron.log
          pnpm --filter @canvas-agent/desktop test 2>&1 | tee ci-artifacts/logs/test-electron.log
          pnpm --filter @canvas-agent/desktop build 2>&1 | tee ci-artifacts/logs/build-electron.log

      - name: Upload reference client logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-reference-client-check-logs
          path: ci-artifacts
          if-no-files-found: error

  macos-electron:
    name: macos-electron
    runs-on: macos-latest
    needs: electron-check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install reference client dependencies
        run: |
          mkdir -p ci-artifacts/logs
          set -o pipefail
          pnpm install --frozen-lockfile --filter '@canvas-agent/desktop...' 2>&1 | tee ci-artifacts/logs/install.log

      - name: Credential-free Electron RC suite
        run: |
          mkdir -p ci-artifacts/logs
          set -o pipefail
          CANVAS_AGENT_RC_LOG_DIR="$PWD/ci-artifacts/logs" \
          CANVAS_AGENT_RC_REPORT_DIR="$PWD/ci-artifacts/reports" \
          CANVAS_AGENT_E2E_SCREENSHOT_DIR="$PWD/ci-artifacts/screenshots" \
          pnpm --filter @canvas-agent/desktop e2e:rc 2>&1 | tee ci-artifacts/logs/rc-suite.log

      - name: Upload Electron RC evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-reference-client-rc-evidence
          path: ci-artifacts
          if-no-files-found: error
