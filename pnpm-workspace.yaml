packages:
  - apps/*
  - packages/*
  - research/*

allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  # Reviewed for the Pi dependency chain (DS-008): @google/genai 1.52.0 has only
  # a no-op preinstall; protobufjs 7.6.5 postinstall only checks dependency
  # versions and prints a warning. Neither generates runtime-required files, so
  # both are denied. Exact versions keep future upgrades gated for re-review.
  '@google/genai@1.52.0': false
  'protobufjs@7.6.5': false

verifyDepsBeforeRun: false

minimumReleaseAge: 1440
trustLockfile: true

minimumReleaseAgeExclude:
  - lucide-react@1.29.0
  - shadcn@4.16.2

overrides:
  "@electron/get": 4.0.3
  extract-zip: "npm:@electron-internal/extract-zip@1.0.1"

patchedDependencies:
  electron@39.8.10: patches/electron@39.8.10.patch
